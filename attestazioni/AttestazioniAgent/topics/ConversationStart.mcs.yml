mcs.metadata:
  componentName: Inizio conversazione
  description: Questo argomento di sistema si attiva quando l'agente riceve un'attività che indica l'inizio di una nuova conversazione. Se non vuoi che l'agente avvii la conversazione, disabilita questo argomento.
kind: AdaptiveDialog
beginDialog:
  kind: OnConversationStart
  id: main
  actions:
    - kind: SendActivity
      id: sendMessage_M0LuhV
      activity:
        text:
          - Ciao, sono {System.Bot.Name}. Come posso aiutarti?
        speak:
          - Ciao e grazie per aver chiamato {System.Bot.Name}. Alcune risposte sono generate dall'IA e potrebbero richiedere una verifica dell'accuratezza. Come posso aiutarti oggi?